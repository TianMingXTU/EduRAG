[project]
name = "edurag"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "langsmith>=0.10.9",
    "loguru>=0.7.3",
    "pymilvus>=3.0.0",
    "pymupdf>=1.28.0",
    "unstructured[md]>=0.24.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.2.0",
    "pymysql>=1.1.1",
    "networkx>=3.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "langchain-redis>=0.2.5",
    "aiomysql>=0.3.2",
    "tortoise-orm>=1.1.7",
    "cryptography>=49.0.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[tool.poetry]
packages = [{include = "edurag", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
